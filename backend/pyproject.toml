[project]
name = "astra-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.16.0",
    "astropy==8.0.2",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "photutils==3.1.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "reproject>=0.21.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real network services"]
addopts = "-m \"not live\""
